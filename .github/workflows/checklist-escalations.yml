name: Cobrança automática de checklist

# A cobrança de checklist (avisos de "perto do prazo", "atrasado", "não
# realizado" — ver processChecklistEscalations em src/lib/checklist-server.ts)
# roda 1x por dia via Vercel Cron (ver vercel.json, mantido como reforço —
# o Hobby do Vercel só permite 1 execução diária por cron, então sozinho
# ele deixaria os avisos "atrasados" chegarem só à noite) e, desde #239,
# também aqui a cada poucos minutos via GitHub Actions (mesmo padrão já
# usado em keep-alive.yml: GitHub Actions aceita intervalos curtos de
# graça, diferente do cron nativo do Vercel Hobby).
#
# Frequência 5 min (era 15 min): o limiar "atraso do responsável"
# (avisoAtrasoResponsavelMinutos) passou a ser 15 minutos pra todo
# checklist — com um cron de 15 em 15 min, o pior caso de atraso pra
# notificar chegava perto de 30 min (15 min de limiar + até 15 min até o
# próximo tick) em vez dos 15 min pedidos. Em 5 em 5 min o pior caso cai
# pra ~20 min, bem mais perto da intenção original. GET
# /api/checklist/escalations/run é idempotente (ChecklistEscalationLog
# garante uma notificação por ocorrência+nível+destinatário), então rodar
# com mais frequência nunca duplica aviso.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de cobrança de checklist
        run: |
          curl -sS -o /dev/null -w "status=%{http_code}\n" \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.portalnord.com.br/api/checklist/escalations/run"
